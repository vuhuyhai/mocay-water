# Cấu hình Netlify cho website Cấp Thoát Nước Mỏ Cày (site tĩnh + serverless functions)
[build]
  publish = "."          # index.html nằm ở gốc repo

[functions]
  directory = "netlify/functions"

# Header bảo mật cơ bản (an toàn, không phá layout hiện tại)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"                       # chống clickjacking (nhúng site vào iframe lạ)
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
