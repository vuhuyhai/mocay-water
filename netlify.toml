# Cấu hình Netlify cho website Cấp Thoát Nước Mỏ Cày (site tĩnh + serverless functions)
[build]
  publish = "."          # index.html nằm ở gốc repo

[functions]
  directory = "netlify/functions"

# Header bảo mật cơ bản (an toàn, không phá layout hiện tại)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"                       # chống clickjacking (nhúng site vào iframe lạ)
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Bai Bang gia nuoc da go khoi website. Chuyen huong URL cu ve bai cach tinh
# tien nuoc de nguoi dang o ket qua tim kiem khong roi vao trang 404.
[[redirects]]
  from = "/huong-dan/bang-gia-nuoc-mo-cay"
  to = "/huong-dan/cach-tinh-tien-nuoc"
  status = 301
  force = true

[[redirects]]
  from = "/huong-dan/bang-gia-nuoc-mo-cay.html"
  to = "/huong-dan/cach-tinh-tien-nuoc"
  status = 301
  force = true

# Trinh duyet va Zalo hay tu goi /favicon.ico. Tra ve logo PNG thay vi 404.
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/logo-mo-cay.png"
  status = 200

# Ten mien phu cua Netlify tro ve ten mien chinh, tranh hai ban trung noi dung.
[[redirects]]
  from = "https://mocay-water.netlify.app/*"
  to = "https://mocaywaco.com/:splat"
  status = 301
  force = true
